<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My CloudDiary - View Videos</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Quicksand',sans-serif;}
    body{background:linear-gradient(180deg,#ffeef3 0%, #fff8fa 100%);min-height:100vh;padding:18px;display:flex;flex-direction:column;align-items:center;}
    header{background:#ff9bbd;color:#fff;padding:14px;border-radius:10px;text-align:center;font-family:'Dancing Script',cursive;font-size:1.6rem;box-shadow:0 4px 10px rgba(0,0,0,0.08);width:100%;max-width:600px;margin-bottom:20px;}
    .video-card{background:#fff;border-radius:12px;padding:15px;box-shadow:0 6px 18px rgba(255,182,193,0.12);max-width:500px;width:100%;margin-bottom:15px;display:flex;flex-direction:column;gap:8px;}
    video, img{width:100%;border-radius:10px;}
    .title{font-weight:600;color:#333;}
    .btn-row{display:flex;justify-content:center;margin-top:12px;gap:10px;flex-wrap:wrap;}
    .btn{background:white;border:none;padding:8px 14px;border-radius:30px;cursor:pointer;box-shadow:0 0 10px rgba(255,182,193,0.8);}
    .btn.primary{background:#ff9bbd;color:#fff;}
    .btn.delete{background:#ff4d6d;color:#fff;}
  </style>
</head>
<body>

<header>My Diary - My Videos</header>

<div id="videosContainer"></div>

<div class="btn-row">
  <button class="btn primary" id="backBtn">🔙 Back to Dashboard</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDHr1TTUnAjGJyjDOqBuqvo2tnAKiNvdCE",
    authDomain: "my-clouddiary.firebaseapp.com",
    projectId: "my-clouddiary",
    storageBucket: "my-clouddiary.firebasestorage.app",
    messagingSenderId: "859635487485",
    appId: "1:859635487485:web:07bd2c20d274037cade494",
    measurementId: "G-2WVB9HTS5R"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const videosContainer = document.getElementById('videosContainer');
  const backBtn = document.getElementById('backBtn');

  let currentUserEmail = null;

  onAuthStateChanged(auth, async user => {
    if(!user){
      alert('Please log in first.');
      window.location.href='index.html';
      return;
    }
    currentUserEmail = user.email;
    await loadVideos();
  });

  async function loadVideos(){
    videosContainer.innerHTML = '';
    try {
      const q = query(collection(db,'videos'), where('user','==',currentUserEmail));
      const snapshot = await getDocs(q);

      if(snapshot.empty){
        videosContainer.innerHTML = "<p>No videos uploaded yet.</p>";
        return;
      }

      snapshot.forEach(docSnap=>{
        const data = docSnap.data();
        const div = document.createElement('div');
        div.className = 'video-card';

        const title = document.createElement('p');
        title.className = 'title';
        title.textContent = data.title;
        div.appendChild(title);

        if(data.dataUrl.startsWith('data:image/')){
          const img = document.createElement('img');
          img.src = data.dataUrl;
          div.appendChild(img);
        } else {
          const video = document.createElement('video');
          video.src = data.dataUrl;
          video.controls = true;
          div.appendChild(video);
        }

        const btnRow = document.createElement('div');
        btnRow.className = 'btn-row';

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn delete';
        deleteBtn.textContent = '🗑 Delete';
        deleteBtn.addEventListener('click', async ()=>{
          if(confirm(`Delete "${data.title}"?`)){
            try {
              await deleteDoc(doc(db,'videos',docSnap.id));
              div.remove();
              alert('Deleted successfully.');
            } catch(err){
              console.error(err);
              alert('Error deleting file.');
            }
          }
        });

        btnRow.appendChild(deleteBtn);
        div.appendChild(btnRow);

        videosContainer.appendChild(div);
      });

    } catch(err){
      console.error(err);
      videosContainer.innerHTML = "<p>Error loading videos.</p>";
    }
  }

  backBtn.addEventListener('click', ()=>window.location.href='landing.html');
</script>

</body>
</html>
